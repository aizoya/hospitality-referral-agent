name: Hospitality Referral Agent CI

on:
  push:
    branches:
      - main
      - build/strands-vertical-slice
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Smoke-test deterministic demo
        run: python -m scripts.run_demo --score-only
